# Serveur de salons WARBOUND : Cloudflare Worker + Durable Objects (offre gratuite, stockage SQLite).
# Rien n'est déployé tant que `npm run deploy` n'a pas été lancé avec un compte Cloudflare.
name = "warbound-lobby"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "GUARD"
class_name = "Guard"

# l'offre gratuite n'accepte que les Durable Objects adossés à SQLite
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby", "Guard"]

# Base D1 (comptes, objets possédés, achats). Créer la base avec `npx wrangler d1 create warbound`,
# puis remplacer database_id ci-dessous. En local (`npm run dev`), une base locale est utilisée.
[[d1_databases]]
binding = "DB"
database_name = "warbound"
database_id = "6bd03c61-3845-41b8-a5f0-585f75caa731"
migrations_dir = "migrations"

[vars]
# origines autorisées à ouvrir un salon (séparées par des virgules)
ALLOWED_ORIGINS = "https://warbound.netlify.app,https://warbound.pages.dev,http://localhost:4173,http://localhost:4174,http://localhost:5173"
# garde-fous de quotas (offre gratuite : 100 000 requêtes par jour pour les Workers et pour les Durable Objects)
MAX_ROOMS_PER_DAY = "1500"
MAX_JOINS_PER_DAY = "12000"
MAX_ROOMS_PER_IP_PER_HOUR = "10"
# Paiements : désactivés tant que les secrets STRIPE_SECRET_KEY et STRIPE_WEBHOOK_SECRET ne sont pas définis
# (`npx wrangler secret put STRIPE_SECRET_KEY`). Utiliser d'abord les clés de MODE TEST (sk_test_...).
# Adresse du jeu, pour les retours après paiement :
GAME_URL = "https://warbound.netlify.app/"
