# Serveur de salons WARBOUND : Cloudflare Worker + Durable Objects (offre gratuite, stockage SQLite).
# Rien n'est déployé tant que `npm run deploy` n'a pas été lancé avec un compte Cloudflare.
name = "warbound-lobby"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "GUARD"
class_name = "Guard"

# l'offre gratuite n'accepte que les Durable Objects adossés à SQLite
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby", "Guard"]

[vars]
# origines autorisées à ouvrir un salon (séparées par des virgules)
ALLOWED_ORIGINS = "https://warbound.netlify.app,https://warbound.pages.dev,http://localhost:4173,http://localhost:4174,http://localhost:5173"
# garde-fous de quotas (offre gratuite : 100 000 requêtes par jour pour les Workers et pour les Durable Objects)
MAX_ROOMS_PER_DAY = "1500"
MAX_JOINS_PER_DAY = "12000"
MAX_ROOMS_PER_IP_PER_HOUR = "10"
